name = "uniquemdv2"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Free-tier KV namespace — used for group stats, warnings, settings.
# Create it once with: wrangler kv:namespace create BOT_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "BOT_KV"
id = "573533518d33421ab8bb31d73e332e58"

# Secrets (set with `wrangler secret put NAME`, never hardcode):
#   wrangler secret put BOT_TOKEN
#   wrangler secret put WEBHOOK_SECRET
#
# Vars (safe to keep here, non-secret):
[vars]
BOT_OWNER_ID = "0"  # your numeric Telegram user ID, for /admin-only global commands
